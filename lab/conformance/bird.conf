log stderr all;
router id 10.0.0.4;

protocol device { }

protocol bgp claude {
  local 127.0.0.4 as 65004;
  # bgp4r listens on 1179 here, so BIRD can keep 179 for itself.
  neighbor 127.0.0.1 port 1179 as 65001;
  multihop;
  # Bind the listening socket to our own address, not the wildcard,
  # so several routers can share the host.
  strict bind;
  connect retry time 2;
  # The matrix gives each fault its own session, so BIRD must come
  # straight back. Its default error wait is minutes.
  error wait time 1, 2;
  error forget time 10;
  ipv4 {
    import all;
    export none;
  };
  ipv6 {
    import all;
    export none;
  };
}
