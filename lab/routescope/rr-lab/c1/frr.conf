! c1: FRR in AS 65100, a client of rr1. A plain iBGP speaker: a client
! needs no configuration to be one, which is the point of RFC 4456.
!
! The static route resolves every next hop in the lab. Reflection leaves
! NEXT_HOP alone, so a route from inj-c arrives with 10.100.1.1, which
! is not on c1's link.
frr version 10.2.1_git
frr defaults traditional
hostname c1
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip route 10.100.0.0/16 10.100.11.1
!
interface eth1
 description to rr1
 ip address 10.100.11.2/30
exit
!
router bgp 65100
 bgp router-id 10.100.255.21
 timers bgp 10 30
 !
 neighbor 10.100.11.1 remote-as 65100
 neighbor 10.100.11.1 description rr1
 neighbor 10.100.11.1 timers connect 5
exit
!
