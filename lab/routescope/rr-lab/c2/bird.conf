# c2: BIRD 2 in AS 65100, a client of rr1. It imports and advertises
# nothing of its own, so everything in its table came from rr1.
#
# `gateway recursive` and the static route resolve the next hops, which
# reflection leaves alone. bgp4r-lab's r3 found that a `direct` iBGP
# session drops every route whose next hop is not on its own link
# without it.
router id 10.100.255.22;
log stderr all;

protocol device { scan time 2; }

protocol static {
  ipv4;
  route 10.100.0.0/16 via 10.100.12.1;
}

protocol bgp rr1 {
  local as 65100;
  neighbor 10.100.12.1 as 65100;
  direct;
  hold time 30;
  keepalive time 10;
  connect retry time 5;
  ipv4 {
    gateway recursive;
    import all;
    export none;
  };
}
