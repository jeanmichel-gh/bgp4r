# Point 2 of this lab's README: a prefix injected on command reaches r2
# and r3 with rtr's AS prepended and rtr as the next hop, which is rtr
# **routing** rather than originating.
#
# The last step is the contrast that makes the point: 10.255.0.0/24 is in
# rtr's own `originate` block and reaches r1 with one AS in its path,
# where the injected prefix reaches it with two. Transit and origination
# are different jobs and this scenario asserts both at once.
#
# NOT RUN: the lab is deployed by bgp4r's Capture job, but this scenario
# has not been run, so nothing here is a measurement. Every expectation is read out of the node files and the
# RFC sections they cite.

name: A prefix injected on command crosses to FRR and BIRD
description: >-
  The injectors start silent, so r2 and r3 hold nothing of ours to begin
  with. inj1 announces 10.1.0.0/24 and it must reach r1, r2 and r3 with
  AS_PATH 65000 65010 and rtr's own address as the next hop.
capture: [rtr]
timeout: 180

steps:
  # Point 1: six sessions across three implementations. Read from each
  # end that can see it, which for the iBGP mesh is r1.
  - expect: { bgp_session: { node: rtr, peer: 10.0.10.1, state: established } }
    within: 60
    measure: inj1_session
  - expect: { bgp_session: { node: rtr, peer: 10.0.11.1, state: established } }
    within: 60
    measure: inj2_session
  - expect: { bgp_session: { node: rtr, peer: 10.0.20.2, state: established } }
    within: 60
    measure: r1_session
  - expect: { bgp_session: { node: r1, peer: 10.1.12.2, state: established } }
    within: 60
  - expect: { bgp_session: { node: r1, peer: 10.1.13.2, state: established } }
    within: 60
    name: r1 to r3 is read from r1, since BIRD is the far end

  # The empty baseline, and it is what stops a later step passing on a
  # route a configuration created. An injector announces nothing on its
  # own, which is why this can be asserted at all.
  - mark: nothing has been injected yet
  - expect: { bgp_prefix: { node: rtr, prefix: 10.1.0.0/24, present: false } }
  - expect: { bgp_prefix: { node: r2, prefix: 10.1.0.0/24, present: false } }
  - expect: { bgp_prefix: { node: r3, prefix: 10.1.0.0/24, present: false } }

  - bgp: announce
    node: inj1
    prefixes: [10.1.0.0/24]
    med: 100
    communities: ['65010:1']

  # At rtr it is what inj1 sent: one AS in the path and the injector's own
  # address as the next hop.
  - expect: { bgp_prefix: { node: rtr, prefix: 10.1.0.0/24,
                            as_path: '65010', next_hop: 10.0.10.1 } }
    within: 15
    measure: announce_to_rtr

  # Past rtr it is rtr's: our AS in front (RFC 4271 section 5.1.2) and our
  # address on that session as the next hop (section 5.1.3).
  - expect: { bgp_prefix: { node: r1, prefix: 10.1.0.0/24,
                            as_path: '65000 65010', next_hop: 10.0.20.1 } }
    within: 15
    measure: announce_to_frr

  # And into the mesh unchanged, because iBGP leaves both alone. That is
  # also why r2 and r3 each carry a static route to 10.0.20.0/30: without
  # one the next hop below does not resolve and the path is not usable.
  - expect: { bgp_prefix: { node: r2, prefix: 10.1.0.0/24,
                            as_path: '65000 65010', next_hop: 10.0.20.1 } }
    within: 20
  - expect: { bgp_prefix: { node: r3, prefix: 10.1.0.0/24,
                            as_path: '65000 65010', next_hop: 10.0.20.1 } }
    within: 20
    measure: announce_to_bird

  # The contrast: rtr's own prefix has one AS in its path at r1 where the
  # injected one has two, so the two jobs are visibly different.
  - expect: { bgp_prefix: { node: r1, prefix: 10.255.0.0/24, as_path: '65000' } }
    within: 20
    name: what rtr originates carries its AS once, not twice
