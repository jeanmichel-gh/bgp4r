# inj1, a bgp4r-sim in AS 65010. One eBGP session, to rtr.
#
# **No `announce` block, and that is the rule rather than an omission.**
# An injector starts silent, because a baseline the configuration created
# is a baseline no assertion can rest on: a scenario asserts rtr holds
# nothing, announces, and asserts again. `bgp/sim/injector.rb`'s header
# has it, and `examples/sim.yml` is the one documented waiver, for
# `bgp4r routegen`, which needs something to send.
#
# The keys are the node file keys `lab/README.md` documents, plus `api`.
# The four that would build a Loc-RIB, `rib`, `originate`, `export` and
# `fib`, are `bgp4rd`'s and this program refuses them by name: an
# injector quietly deciding routes would void every assertion a scenario
# makes about what it sent.
#
# `api:` is where the HTTP API binds. The loopback is the default and is
# also what routescope's `Drivers::Bgp4rSim` hard-codes, so it is reached
# with `docker exec` and no port is published.
router_id: 10.255.10.1
as: 65010
api: 127.0.0.1:8080
log_level: info

# One interface carries BGP here, so naming it keeps the session off the
# containerlab management network. rtr has three and names none, for the
# reason its own file gives.
local_address: 10.0.10.1

neighbors:
  - address: 10.0.10.2
    as: 65000
    connect: true            # the injector dials, so the lab comes up either way
    hold_time: 30
    description: rtr
    capabilities: [as4_byte, route_refresh]
