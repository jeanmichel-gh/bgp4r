# bgp4r-lab: six nodes, three implementations, one containerlab topology.
# docs/routescope-labs.md section 8, "The lab to build first, concretely".
#
#   AS 65010                    AS 65000       AS 65001 (iBGP full mesh)
#
#   inj1 .10.1 --eBGP--\
#    (bgp4r-sim)         >-- rtr --eBGP-- r1 ------- r2
#   inj2 .11.1 --eBGP--/  (bgp4rd)      (FRR) \     / (FRR)
#    (bgp4r-sim)                               r3 (BIRD)
#
#   link            prefix          ends
#   inj1 - rtr      10.0.10.0/30    inj1:eth1 .1    rtr:eth1 .2
#   inj2 - rtr      10.0.11.0/30    inj2:eth1 .1    rtr:eth2 .2
#   rtr  - r1       10.0.20.0/30    rtr:eth3  .1    r1:eth1  .2
#   r1   - r2       10.1.12.0/30    r1:eth2   .1    r2:eth1  .2
#   r1   - r3       10.1.13.0/30    r1:eth3   .1    r3:eth1  .2
#   r2   - r3       10.1.23.0/30    r2:eth2   .1    r3:eth2  .2
#
# **Both injectors are in one AS on purpose.** MULTI_EXIT_DISC only
# compares paths from the same neighbouring AS, so that is what makes
# rtr's decision answer `med` rather than skip the step, and what lets
# one action flip which path wins. Two injectors in two ASes would be
# decided at AS_PATH length and the MED step would never be reached.
#
# **Containerlab and not Compose**, where bgp4r's four existing
# `lab/topologies/` are Compose and stay that way. Those drive
# `lab/speaker.rb` for bgp4r's own test suite and routescope never sees
# them. This one is for routescope, and `Links#ends` resolves both ends
# of a link from `lab.links`, which a Compose lab does not declare, so on
# Compose only one end of a link fault is acted on. See
# docs/routescope-labs.md section 8.
#
# Deploy it, then point routescope at the folder:
#
#   sudo containerlab deploy -t lab/routescope/bgp4r-lab/bgp4r-lab.clab.yml
#   LAB=$PWD/lab/routescope/bgp4r-lab docker compose -f ~/routescope/compose.yml up -d
#   sudo containerlab destroy -t lab/routescope/bgp4r-lab/bgp4r-lab.clab.yml
#
# Three images, and the first is bgp4r's own:
#
#   docker build --target lab-node -t bgp4r-lab:latest .
#   docker build -f lab/routescope/bgp4r-lab/Dockerfile.bird \
#                -t bgp4r-bird:latest lab/routescope/bgp4r-lab
#   docker pull quay.io/frrouting/frr:10.2.1
#
# **`lab-node` and not `speaker`, and the reason is not cosmetic.** The
# `speaker` stage the Compose topologies use runs as the non-root user
# `bgp` and carries no iproute2, so the `exec:` lines below have no `ip`
# to run and `bgp4rd` cannot create `/run/bgp4r` for its control socket,
# which is the one path routescope's `Drivers::Bgp4rd` looks in for a
# containerlab node. `lab-node` is that stage plus iproute2, as root.
#
# All three bgp4r nodes come from one image and are told apart by their
# command, `bgp4rd` against `bgp4r-sim`, which is also how routescope's
# `Containerlab#kind_of` tells them apart. The labels say it outright
# anyway, because an explicit label survives an image rename.
#
# **Every node carries both labels rather than inheriting
# `routescope.protocols` from a `defaults:` block.** All three of
# ospfv2's BGP labs set it in defaults; written per node it does not
# depend on how containerlab merges a label map, which is not something
# this repository can check.
#
# The injectors **start silent**: no `announce` block in either node
# file. A baseline the configuration created is a baseline no assertion
# can rest on, so `scenarios/` is what puts anything on the wire.
#
# **This topology is deployed by CI**, in `.github/workflows/capture.yml`,
# first on 2026-11-03. That run measured the six sessions up, a route from
# inj1 crossing rtr to FRR and BIRD with AS_PATH 65000 65010, rtr deciding
# 10.1.0.0/24 on MED, all three kinds of community reaching BIRD, and a
# flap counted by FRR, bgp4rd and the injector. It also found the one bug
# a parse could not: BIRD dropped every route from rtr until r3 took
# `gateway recursive`, which its bird.conf says. The scenarios are not run
# by that job; routescope runs them.
# `test/functional/lab/bgp4r_lab_topology_test.rb` holds these files to
# each other and to the README with no Docker.
name: bgp4r-lab

topology:
  nodes:

    # AS 65010, the two injectors. Silent until an action asks.
    #
    # The API binds 127.0.0.1:8080, which is the default and is also
    # what routescope's `Drivers::Bgp4rSim` hard-codes, so it is reached
    # by `docker exec` and needs no published port. That is also why it
    # is the loopback: an API on 0.0.0.0 is reachable from every other
    # node on the lab segment.
    inj1:
      kind: linux
      image: bgp4r-lab:latest
      cmd: exe/bgp4r-sim /lab/sim.yml -l -
      labels:
        routescope.kind: bgp4r-sim
        routescope.protocols: bgp
      binds:
        - inj1:/lab
      exec:
        - ip addr add 10.0.10.1/30 dev eth1

    inj2:
      kind: linux
      image: bgp4r-lab:latest
      cmd: exe/bgp4r-sim /lab/sim.yml -l -
      labels:
        routescope.kind: bgp4r-sim
        routescope.protocols: bgp
      binds:
        - inj2:/lab
      exec:
        - ip addr add 10.0.11.1/30 dev eth1

    # AS 65000, the router. It routes rather than originates what the
    # injectors send: the prefixes a scenario injects are learned from
    # inj1 and inj2, decided, and advertised to r1 with our AS prepended
    # and our address as the next hop. Its own `originate` block is one
    # prefix of its own, 10.255.0.0/24, and no scenario injects that one.
    #
    # `-s` names the control socket rather than the node file's `socket:`
    # key, which `Server#build` does not read; see the README.
    rtr:
      kind: linux
      image: bgp4r-lab:latest
      cmd: exe/bgp4rd -f /etc/bgp4r/bgp4rd.yml -s /run/bgp4r/bgp4rd.sock -l -
      labels:
        routescope.kind: bgp4r
        routescope.protocols: bgp
      binds:
        - rtr/bgp4rd.yml:/etc/bgp4r/bgp4rd.yml
      exec:
        - ip addr add 10.0.10.2/30 dev eth1
        - ip addr add 10.0.11.2/30 dev eth2
        - ip addr add 10.0.20.1/30 dev eth3

    # AS 65001, the iBGP full mesh. r1 is the only one with a session
    # outside the AS, so it is where a route from rtr enters and from
    # where it reaches r2 and r3.
    #
    # frr.conf carries the addresses too; FRR can miss them on links
    # wired after it starts, which is why ospfv2's labs set them in
    # `exec:` as well and why these do.
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      labels:
        routescope.kind: frr
        routescope.protocols: bgp
      binds:
        - r1:/etc/frr
      exec:
        - sh -c "ip addr add 10.0.20.2/30 dev eth1 2>/dev/null || true"
        - sh -c "ip addr add 10.1.12.1/30 dev eth2 2>/dev/null || true"
        - sh -c "ip addr add 10.1.13.1/30 dev eth3 2>/dev/null || true"

    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      labels:
        routescope.kind: frr
        routescope.protocols: bgp
      binds:
        - r2:/etc/frr
      exec:
        - sh -c "ip addr add 10.1.12.2/30 dev eth1 2>/dev/null || true"
        - sh -c "ip addr add 10.1.23.1/30 dev eth2 2>/dev/null || true"

    # BIRD is the far end of the chain: a withdraw reaching it is the
    # last of the README's five points. It imports and advertises
    # nothing, so what its RIB holds came from somewhere else.
    r3:
      kind: linux
      image: bgp4r-bird:latest
      labels:
        routescope.kind: bird
        routescope.protocols: bgp
      binds:
        - r3:/etc/bird
      exec:
        - ip addr add 10.1.13.2/30 dev eth1
        - ip addr add 10.1.23.2/30 dev eth2
        - ip addr add 10.255.1.3/32 dev lo

  links:
    - endpoints: ["inj1:eth1", "rtr:eth1"]
    - endpoints: ["inj2:eth1", "rtr:eth2"]
    - endpoints: ["rtr:eth3", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
