! r2: FRR in AS 65001, an interior node of the mesh. It has no session
! outside the AS, so everything it holds from AS 65010 came through r1.
!
! The shape of this file is ospfv2's examples/bgp-lab/r2/frr.conf, read
! at ospfv2 2dfc03a. What is bgp4r's own is the static route below and
! the timers.
!
! Deployed for the first time on 2026-11-03, by the Capture workflow.
frr version 10.2.1_git
frr defaults traditional
hostname r2
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
! **The next hop of a route from rtr is rtr**, because r1 does not set
! next-hop-self and iBGP leaves NEXT_HOP alone (RFC 4271 section 5.1.3).
! So 10.0.20.1 has to be reachable here or the path is not usable. A real
! network carries that in an IGP; this lab has none, so it is a static
! route via r1 and it is never redistributed.
ip route 10.0.20.0/30 10.1.12.1
!
interface lo
 ip address 10.255.1.2/32
exit
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
exit
!
interface eth2
 description to r3
 ip address 10.1.23.1/30
exit
!
router bgp 65001
 bgp router-id 10.255.1.2
 no bgp ebgp-requires-policy
 timers bgp 10 30
 !
 neighbor 10.1.12.1 remote-as 65001
 neighbor 10.1.12.1 description r1
 neighbor 10.1.12.1 timers connect 5
 neighbor 10.1.23.2 remote-as 65001
 neighbor 10.1.23.2 description r3
 neighbor 10.1.23.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.1.2/32
 exit-address-family
exit
!
