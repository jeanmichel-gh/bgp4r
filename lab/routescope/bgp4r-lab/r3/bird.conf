# r3: BIRD 2 in AS 65001, the far end of the chain. A withdraw reaching
# here is the last of the five points in this lab's README, and it is the
# third implementation in a lab whose middle is bgp4r.
#
# The shape of this file is ospfv2's examples/bgp-lab/r3/bird.conf, read
# at ospfv2 2dfc03a: the device protocol with a short scan time because
# containerlab sets the addresses after BIRD starts, the `direct` iBGP
# template, and the kernel export. What is bgp4r's own is the static
# route for rtr's next hop, the import-only filters and the timers.
#
# Edit here, then `birdc configure`, or Load file in routescope.
#
# Deployed for the first time on 2026-11-03, by the Capture workflow.
router id 10.255.1.3;
log stderr all;

# The addresses come from containerlab after BIRD starts, so look often.
protocol device { scan time 2; }

protocol direct { ipv4; interface "lo"; }

# What it learns by BGP goes to the kernel, so a route here is a route in
# the container's own forwarding table and routescope can show both.
protocol kernel {
  ipv4 { export where source = RTS_BGP; };
}

# **The next hop of a route from rtr is rtr**, because r1 does not set
# next-hop-self and iBGP leaves NEXT_HOP alone (RFC 4271 section 5.1.3).
# So 10.0.20.1 has to resolve here. A real network carries that in an
# IGP; this lab has none, so it is a static route via r1. The BGP
# sessions export nothing, so it cannot leak.
protocol static {
  ipv4;
  route 10.0.20.0/30 via 10.1.13.1;
}

# iBGP, and its peers are on its own links, so `direct` holds.
#
# **It imports and advertises nothing of its own**, which is what makes
# it the far end: everything in its table arrived from somewhere else, so
# an assertion that a prefix is gone from here cannot be satisfied by
# anything r3 did.
#
# 10 and 30 to match the hold_time: 30 the bgp4r node files set, since
# RFC 4271 section 4.2 negotiates the smaller of the two.
template bgp as65001 {
  local as 65001;
  direct;
  hold time 30;
  keepalive time 10;
  connect retry time 5;
  ipv4 {
    # **Recursive, or BIRD drops every route from rtr.** A `direct`
    # session defaults to `gateway direct`, which wants the next hop on
    # one of this node's own links, and 10.0.20.1 is not: measured on
    # the first deploy, 2026-11-03, BIRD logged "Invalid NEXT_HOP
    # attribute - address 10.0.20.1 not directly reachable" and withdrew
    # all three of rtr's prefixes while r1 and r2 held them. Recursive
    # resolves it through the static route above.
    gateway recursive;
    import all;
    export none;
  };
}

protocol bgp r1 from as65001 { neighbor 10.1.13.1 as 65001; }
protocol bgp r2 from as65001 { neighbor 10.1.23.1 as 65001; }
