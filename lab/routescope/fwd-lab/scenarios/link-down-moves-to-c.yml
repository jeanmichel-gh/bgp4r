# The b to d link goes down. No NOTIFICATION can cross it, so b's
# session to d ends when its hold timer runs out, 9 seconds, and then
# the path through c is the only one. The link comes back and the
# direct path wins again.
#
# The kernel removes b's route through eth3 the moment the link is down,
# so traffic to d is dropped until the session ends. That gap is what
# `failover` measures.
#
# NOT RUN: the lab is deployed by bgp4r's Capture job, but this scenario
# has not been run, so nothing here is a measurement. Its twin is
# test/functional/lab/fwd_lab_netns_test.rb.
name: The b to d link fails and traffic moves through c
description: >-
  b:eth3 goes down. b routes d's loopback through c once its hold timer
  ends the session, and a sees the longer AS_PATH. Then the link comes
  back and the direct path wins again.
capture: [b, c]
timeout: 180

steps:
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.4.2 } }
    within: 60

  - mark: b to d link down
  - interface: b:eth3
    state: down
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.2.2, as_path: '65003 65004' } }
    within: 20
    measure: failover
  - expect: { bgp_prefix: { node: a, prefix: 10.255.0.4/32, as_path: '65002 65003 65004' } }
    within: 10
  - expect: { bgp_prefix: { node: d, prefix: 10.255.0.1/32, next_hop: 10.200.3.1 } }
    within: 10

  - mark: b to d link up
  - interface: b:eth3
    state: up
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.4.2 } }
    within: 30
    measure: restore
  - expect: { bgp_prefix: { node: a, prefix: 10.255.0.4/32, as_path: '65002 65004' } }
    within: 10
