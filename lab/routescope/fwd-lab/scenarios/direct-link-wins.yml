# Every router learns every loopback, and b reaches d over the direct
# link: AS_PATH 65004 against 65003 65004 through c, and the shorter
# wins (RFC 4271 section 9.1.2.2 a).
#
# NOT RUN: the lab is deployed by bgp4r's Capture job, but this scenario
# has not been run, so nothing here is a measurement. Its twin is
# test/functional/lab/fwd_lab_netns_test.rb, which runs the lab's own
# files in network namespaces and pings across them.
name: The direct link to d wins
description: >-
  Four eBGP sessions come up, every loopback reaches every router, and b
  chooses the direct link to d over the path through c.
capture: [b]
timeout: 120

steps:
  - expect: { bgp_session: { node: b, peer: 10.200.4.2, state: established } }
    within: 60
  - expect: { bgp_session: { node: b, peer: 10.200.2.2, state: established } }
    within: 60
  - expect: { bgp_session: { node: a, peer: 10.200.1.2, state: established } }
    within: 60
  - expect: { bgp_drained: {} }
    within: 30
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.4.2, as_path: '65004' } }
    within: 30
  - expect: { bgp_best: { node: b, prefix: 10.255.0.4/32, reason: as_path_length } }
    name: b chose the direct link on AS_PATH length
  - expect: { bgp_prefix: { node: a, prefix: 10.255.0.4/32, next_hop: 10.200.1.2, as_path: '65002 65004' } }
  - expect: { bgp_prefix: { node: d, prefix: 10.255.0.1/32, next_hop: 10.200.4.1, as_path: '65002 65001' } }
