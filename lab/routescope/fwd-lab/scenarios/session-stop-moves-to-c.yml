# b stops its session to d by hand. The session ends at once on both
# sides, so this failover does not wait for a hold timer, which is the
# difference link-down-moves-to-c.yml measures the other half of.
#
# NOT RUN: the lab is deployed by bgp4r's Capture job, but this scenario
# has not been run, so nothing here is a measurement. Its twin is
# test/functional/lab/fwd_lab_netns_test.rb.
name: Stopping the b to d session moves traffic through c at once
description: >-
  peer.stop on b toward d, and b routes d's loopback through c with no
  hold timer to wait out. peer.start brings the direct path back.
capture: [b]
timeout: 120

steps:
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.4.2 } }
    within: 60

  - mark: stopping b's session to d
  - bgp: peer.stop
    node: b
    peer: 10.200.4.2
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.2.2 } }
    within: 5
    measure: failover
  - expect: { bgp_prefix: { node: a, prefix: 10.255.0.4/32, as_path: '65002 65003 65004' } }
    within: 5

  - mark: starting it again
  - bgp: peer.start
    node: b
    peer: 10.200.4.2
  - expect: { bgp_session: { node: b, peer: 10.200.4.2, state: established } }
    within: 30
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.4.2 } }
    within: 10
    measure: restore
