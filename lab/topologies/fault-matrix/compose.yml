# The RFC 7606 fault matrix against a real router.
#
#   matrix  AS 65001  10.30.0.1  listens, sends every BGP::Fault::CATALOG case
#   router  AS 65002  10.30.0.2  GoBGP, dials the matrix
#
# lab/fault_matrix.rb only listens, and it hangs up on any peer but the
# one given to --peer, so both sides need fixed addresses.
#
# The matrix runs once and exits. Run it in the foreground and take its
# exit status, which is 0 when every answer agrees with the catalog:
#
#   docker compose -f lab/topologies/fault-matrix/compose.yml up --build \
#     --abort-on-container-exit --exit-code-from matrix
#   docker compose -f lab/topologies/fault-matrix/compose.yml cp \
#     matrix:/tmp/fault-matrix.json .
#   docker compose -f lab/topologies/fault-matrix/compose.yml down
#
# With GoBGP 3.23 that status is 1, not 0, and the run is still correct.
# The two tunnel encapsulation cases differ: GoBGP discards the malformed
# attribute and installs the route where RFC 9012 section 13 asks for
# treat-as-withdraw. test/functional/lab/fault_matrix_test.rb asserts the
# per route outcomes instead of the exit status, and explains it there.
#
# The matrix reads the router's RIB, which is what tells treat-as-withdraw
# from attribute-discard, since both keep the session up. It builds the
# Dockerfile's conformance stage, the speaker plus the gobgp client copied
# out of the router image, and runs the client over gRPC against the
# router's address. GOBGP_IMAGE goes to both services, so the client and
# the router it queries are the same version.
#
# Two knobs, both optional:
#   GOBGP_IMAGE   the router image, to pin a version or swap the router
#   FAULT_SETTLE  seconds to wait after each fault, default 2
#
# The default image is community built and has a native linux/arm64
# build, so it runs on an Apple Silicon Mac without emulation. The old
# osrg/gobgp image on Docker Hub is amd64 only and years stale.
#
# The pin is 4.10.0. It was 3.23.0 for a while, because gobgp.toml next
# to this file was written against 3.23 and the router was pinned to
# match the config. That turned out not to be needed: GoBGP 4 takes the
# same TOML. Every key this config uses is still in the 4.x config
# structs under the same mapstructure name, and 4.x registers
# mapstructure's StringToNetIPAddrHookFunc, so the address fields still
# decode from strings even though their Go type is now netip.Addr.
#
# Both images have a native linux/arm64 build, so either runs on an
# Apple Silicon Mac without emulation. The old osrg/gobgp image on
# Docker Hub is amd64 only and years stale; avoid that one.
#
# To go back to the version the notes in docs/protocol-testing.md were
# measured against, or to try another:
#   GOBGP_IMAGE=jauderho/gobgp:v3.23.0 docker compose ... up
# To check a tag has arm64 before pulling it:
#   docker buildx imagetools inspect jauderho/gobgp:v4.10.0
# If a router will not start, its own log names the config key it
# rejected.
#
# The image reads its config from /config/gobgp.toml and ships both the
# daemon and the gobgp client, so this mounts the topology folder at
# /config and lets the image's own entrypoint start the daemon. An image
# that wants different arguments needs a command here, for example:
#   command: ["gobgpd", "-f", "/config/gobgp.toml", "-t", "toml"]

name: bgp4r-fault-matrix

services:
  router:
    image: ${GOBGP_IMAGE:-jauderho/gobgp:v4.10.0}
    volumes:
      - ./:/config:ro
    networks:
      link:
        ipv4_address: 10.30.0.2
    stop_grace_period: 5s

  matrix:
    build:
      context: ../../..
      target: conformance
      args:
        # Same default as the router above, so one GOBGP_IMAGE moves both.
        GOBGP_IMAGE: ${GOBGP_IMAGE:-jauderho/gobgp:v4.10.0}
    image: bgp4r-conformance
    command:
      - lab/fault_matrix.rb
      - --peer=10.30.0.2
      - --peer-as=65002
      - --listen=10.30.0.1
      - --my-as=65001
      - --id=10.30.0.1
      - --next-hop=10.30.0.1
      - --settle=${FAULT_SETTLE:-2}
      # The gobgp client speaks gRPC to the router on port 50051. One
      # argument, spaces and all: the matrix runs it through a shell and
      # greps the output for the test prefix.
      - --rib-command=gobgp -u 10.30.0.2 global rib
      - --json=/tmp/fault-matrix.json
    depends_on:
      - router
    networks:
      link:
        ipv4_address: 10.30.0.1
    stop_grace_period: 5s

networks:
  link:
    ipam:
      config:
        # The gateway is off .1 and .2 so the two nodes can use them.
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.254
