# The RFC 7606 fault matrix against a real router.
#
#   matrix  AS 65001  10.30.0.1  listens, sends every BGP::Fault::CATALOG case
#   router  AS 65002  10.30.0.2  GoBGP, dials the matrix
#
# lab/fault_matrix.rb only listens, and it hangs up on any peer but the
# one given to --peer, so both sides need fixed addresses.
#
# The matrix runs once and exits. Run it in the foreground and take its
# exit status, which is 0 when every answer agrees with the catalog:
#
#   docker compose -f lab/topologies/fault-matrix/compose.yml up --build \
#     --abort-on-container-exit --exit-code-from matrix
#   docker compose -f lab/topologies/fault-matrix/compose.yml cp \
#     matrix:/tmp/fault-matrix.json .
#   docker compose -f lab/topologies/fault-matrix/compose.yml down
#
# Two knobs, both optional:
#   GOBGP_IMAGE   the router image, to pin a version or swap the router
#   FAULT_SETTLE  seconds to wait after each fault, default 2
#
# The default image is community built and has a native linux/arm64
# build, so it runs on an Apple Silicon Mac without emulation. The old
# osrg/gobgp image on Docker Hub is amd64 only and years stale.
#
# The pin is a 3.x tag because gobgp.toml here is the schema verified
# against GoBGP 3.23, and 3.37 is the same major line. 4.x tags of this
# image exist and are the next step, but a major version is its own
# change; try one without editing anything:
#   GOBGP_IMAGE=jauderho/gobgp:v4.10.0 docker compose ... up
# To check a tag has arm64 before pulling it:
#   docker buildx imagetools inspect jauderho/gobgp:v3.37.0
#
# The image reads its config from /config/gobgp.toml and ships both the
# daemon and the gobgp client, so this mounts the topology folder at
# /config and lets the image's own entrypoint start the daemon. An image
# that wants different arguments needs a command here, for example:
#   command: ["gobgpd", "-f", "/config/gobgp.toml", "-t", "toml"]

name: bgp4r-fault-matrix

services:
  router:
    image: ${GOBGP_IMAGE:-jauderho/gobgp:v3.37.0}
    volumes:
      - ./:/config:ro
    networks:
      link:
        ipv4_address: 10.30.0.2
    stop_grace_period: 5s

  matrix:
    build:
      context: ../../..
      target: speaker
    image: bgp4r-speaker
    command:
      - lab/fault_matrix.rb
      - --peer=10.30.0.2
      - --peer-as=65002
      - --listen=10.30.0.1
      - --my-as=65001
      - --id=10.30.0.1
      - --next-hop=10.30.0.1
      - --settle=${FAULT_SETTLE:-2}
      - --json=/tmp/fault-matrix.json
    depends_on:
      - router
    networks:
      link:
        ipv4_address: 10.30.0.1
    stop_grace_period: 5s

networks:
  link:
    ipam:
      config:
        # The gateway is off .1 and .2 so the two nodes can use them.
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.254
