# Read by the router container as /config/gobgp.toml.
#
# This schema is the one verified against GoBGP 3.23. The compose file
# pins a 4.x image, so if the daemon rejects a key, its log says which
# one and this file is where to fix it.

[global.config]
  as = 65002
  router-id = "10.0.0.2"
  local-address-list = ["10.30.0.2"]

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.30.0.1"
    peer-as = 65001
  [neighbors.transport.config]
    local-address = "10.30.0.2"
  [neighbors.timers.config]
    # The matrix gives each fault its own session, so keep coming back.
    connect-retry = 2
    idle-hold-time-after-reset = 0
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
  # The duplicate MP_REACH case carries IPv6 NLRI, so the router has to
  # agree to IPv6 unicast or it resets over the address family instead.
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-unicast"
