# rtr, a bgp4rd in AS 65000: the one node in this lab that can say why a
# path won. Four sessions, all eBGP: the two injectors in AS 65010, r1 in
# AS 65001 and g1 in AS 65002.
#
# The keys are `lab/speaker.rb`'s node file keys, which `lab/README.md`
# documents, and `docs/daemon.md`'s Configuration section is the daemon's
# own copy of them. A table is always on in `bgp4rd`, so `show.routes`
# and `show.rib` answer and routescope's inspector has rows; `rib: true`
# is written below all the same, because the three keys under it each
# imply a table and a reader should not have to know which.
#
# **It routes rather than originates what the injectors send**, which is
# the README's point 2 and the distinction to keep: a prefix a scenario
# injects arrives from inj1 or inj2, is decided here, and goes out to r1
# with our AS prepended (RFC 4271 section 5.1.2) and our address on that
# session as the next hop (section 5.1.3). Nothing a scenario injects is
# in the `originate` block, or the chain it proves would be origination
# and the injectors would be decoration.
#
# **There is no `socket:` key here and that is not an oversight.**
# `docs/daemon.md` documents one and `BGP::Daemon::Candidate` classifies
# it, but `Server#build` reads `opts[:socket] || Client.default_socket`
# and never `config['socket']`, so the key does nothing today. The clab
# file passes `-s /run/bgp4r/bgp4rd.sock`, which is the path
# routescope's `Drivers::Bgp4rd::SOCKET` looks in. See the README.
router_id: 10.255.0.1
as: 65000
log_level: info

# **No `local_address`, where both injectors name one.** This node has
# three addresses and a next hop is per session, so the right one is the
# one the session itself is on: `Peer#new_neighbor` fills it in from the
# socket when this key is absent, which is what `export` with no
# `next_hops` then advertises.

neighbors:
  - address: 10.0.10.1
    as: 65010
    hold_time: 30
    description: inj1          # the injector dials us
    capabilities: [as4_byte, route_refresh]
    record: routes

  - address: 10.0.11.1
    as: 65010
    hold_time: 30
    description: inj2
    capabilities: [as4_byte, route_refresh]
    record: routes

  - address: 10.0.20.2
    as: 65001
    connect: true              # we dial r1; FRR dials us too and one wins
    hold_time: 30
    description: r1
    capabilities: [as4_byte, route_refresh]
    record: routes

  # g1, the GoBGP in AS 65002, and the second reader of what `export`
  # below puts on the wire. The same three keys as r1 for the same
  # reasons: GoBGP dials us as well, so one side wins the race, and a
  # recorded session is what lets the state file say what went out.
  #
  # **Nothing about `export` is per peer**, which is the point of having
  # this node at all: one Loc-RIB change goes through one `Export#for`
  # per peer and the rules are the same ones, so r1 and g1 are handed
  # the same decision rendered by the same encoder. Two implementations
  # reading that at once is what neither `rib_router_frr_test.rb` nor
  # `rib_router_gobgp_test.rb` can show, since each has one router.
  - address: 10.0.21.2
    as: 65002
    connect: true
    hold_time: 30
    description: g1
    capabilities: [as4_byte, route_refresh]
    record: routes

# A table, decided from what the three peers send.
rib: true

# Our own prefix and nothing a scenario injects. `med` is deliberately
# absent: `Export` deletes MULTI_EXIT_DISC toward every external peer
# (RFC 4271 section 5.1.4) and every peer here is external, so a MED set
# here would reach the Loc-RIB and never the wire. `lab/README.md` and
# docs/daemon.md both carry that caveat.
originate:
  - prefixes: [10.255.0.0/24]
    communities: ['65000:1']

# **`export: {}` and no `next_hops`.** Present at all is what turns
# router mode on. With no `next_hops` an IPv4 route takes our own address
# on each session, which is RFC 4271 section 5.1.3 and the only right
# answer for a router with three links: a single `next_hops: {1: ...}`
# would put one of the three on all of them. `mrai` stays off, which is
# the recorded default: a scenario wants each UPDATE on the wire when it
# says so.
export: {}

# What the forwarding table is believed to hold, so routescope's FIB pane
# has rows beside the Loc-RIB that produced them. `table` is required and
# has no default, because a route in the main table changes where the
# container sends its own traffic.
#
# It needs CAP_NET_ADMIN and `ip` from iproute2 in the container, which
# is part of why this lab wants the Dockerfile's `lab-node` stage rather
# than `speaker`. Where it cannot write, it says so rather than dying:
# the reason lands under `fib` in the state file, with a row per prefix
# the command failed for.
fib:
  table: 100
