! r1: FRR in AS 65001, the one node of that AS with a session outside it.
! A route from rtr enters here and goes on to r2 and r3 over iBGP.
!
! The shape of this file is ospfv2's examples/bgp-lab/r1/frr.conf, read
! at ospfv2 2dfc03a: the same header lines, the same loopback and
! interface blocks, the same `no bgp ebgp-requires-policy` and the same
! per-neighbor description and connect timer. What is bgp4r's own is the
! eBGP session to rtr, the timers matching the node files' hold_time: 30,
! and the deliberate absence of next-hop-self below.
!
! Nothing here has been run: this lab has not been deployed.
frr version 10.2.1_git
frr defaults traditional
hostname r1
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.1.1/32
exit
!
interface eth1
 description to rtr
 ip address 10.0.20.2/30
exit
!
interface eth2
 description to r2
 ip address 10.1.12.1/30
exit
!
interface eth3
 description to r3
 ip address 10.1.13.1/30
exit
!
router bgp 65001
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 ! 10 and 30 to match the hold_time: 30 the bgp4r node files set, since
 ! RFC 4271 section 4.2 negotiates the smaller of the two.
 timers bgp 10 30
 !
 neighbor 10.0.20.1 remote-as 65000
 neighbor 10.0.20.1 description rtr
 neighbor 10.0.20.1 timers connect 5
 !
 ! **No next-hop-self toward either iBGP peer, on purpose.** The lab's
 ! point 2 is that a prefix reaches r2 and r3 with rtr as the next hop,
 ! which is what plain iBGP does: NEXT_HOP is unchanged toward an
 ! internal peer (RFC 4271 section 5.1.3). For it to be usable there,
 ! r2 and r3 each carry a static route to 10.0.20.0/30, which is the
 ! job an IGP would do in a real network and this lab has none.
 neighbor 10.1.12.2 remote-as 65001
 neighbor 10.1.12.2 description r2
 neighbor 10.1.12.2 timers connect 5
 neighbor 10.1.13.2 remote-as 65001
 neighbor 10.1.13.2 description r3
 neighbor 10.1.13.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.1.1/32
 exit-address-family
exit
!
