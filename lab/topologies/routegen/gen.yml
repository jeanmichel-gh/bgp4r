# gen connects to sink and sends generated routes, as examples/routegen does.
# ROUTEGEN_COUNT and ROUTEGEN_PER_UPDATE override count and per_update.
router_id: 10.20.0.1
as: 65001
neighbors:
  - address: 10.20.0.2
    as: 65002
    connect: true
    hold_time: 30
announce:
  - generate: { start: 11.0.0.0/28, count: 10000, per_update: 127 }
    med: 100
    communities: ['100:1', '200:1', '300:1']
    as_path: [90, 80]
