name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Fast feedback: install each Ruby on the runner and run the suites.
  ruby:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Quote versions: unquoted, YAML reads 4.0 as the number 4.
        ruby: ['3.3', '3.4', '4.0']
        experimental: [false]
        include:
          - ruby: head
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit tests
        shell: bash
        run: bundle exec ruby test/run_unit.rb 2>&1 | tee test.log
      - name: Show test failures as an annotation
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          # || true, because grep exits 1 when it matches nothing and
          # this step runs under bash -e: without it the step dies there
          # and the tail fallback below never runs, so a failure whose log
          # has no "Failure:" line is reported as nothing at all. That is
          # what happened to the first lab run of #159.
          msg=$(grep -E -A15 "^(Failure|Error):|Error\b.*\(LoadError\)|cannot load such file" test.log | head -80 || true)
          [ -n "$msg" ] || msg=$(tail -40 test.log)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=Test output::$msg"
      - name: Unit tests with frozen string literals
        # Catches code that mutates a string literal before Ruby freezes them.
        run: bundle exec ruby --enable-frozen-string-literal test/run_unit.rb
      - name: Functional test (add path over loopback)
        run: bundle exec ruby -I. test/functional/add_path_test.rb
        timeout-minutes: 2
      - name: Functional test (routegen over loopback)
        run: bundle exec ruby -I. test/functional/routegen_test.rb
        timeout-minutes: 3
      - name: Functional test (RIB fed by a loopback session)
        run: bundle exec ruby -I. test/functional/rib_feed_test.rb
        timeout-minutes: 2
      - name: Functional test (a route across a bgp4r router)
        run: bundle exec ruby -I. test/functional/rib_router_test.rb
        timeout-minutes: 2
      - name: Functional test (a flow spec UPDATE over loopback)
        run: bundle exec ruby -I. test/functional/flow_spec_test.rb
        timeout-minutes: 2
      - name: Functional test (an EVPN UPDATE over loopback)
        run: bundle exec ruby -I. test/functional/evpn_test.rb
        timeout-minutes: 2
      - name: Lab speaker over loopback
        run: bundle exec ruby -I. test/functional/lab/speaker_test.rb
        timeout-minutes: 3
      # Never run test/functional/live_feed_test.rb: its feed is gone.

  # The same suites inside the Docker image, so the Dockerfile is tested too.
  docker:
    name: docker ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - name: Build the test image
        run: >
          docker build --target test
          --build-arg RUBY_VERSION=${{ matrix.ruby }}
          -t bgp4r-test .
      - name: Unit tests
        shell: bash
        run: docker run --rm bgp4r-test 2>&1 | tee test.log
      - name: Show test failures as an annotation
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          # || true, because grep exits 1 when it matches nothing and
          # this step runs under bash -e: without it the step dies there
          # and the tail fallback below never runs, so a failure whose log
          # has no "Failure:" line is reported as nothing at all. That is
          # what happened to the first lab run of #159.
          msg=$(grep -E -A15 "^(Failure|Error):|Error\b.*\(LoadError\)|cannot load such file" test.log | head -80 || true)
          [ -n "$msg" ] || msg=$(tail -40 test.log)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=Test output::$msg"
      - name: Functional test (add path over loopback)
        run: docker run --rm bgp4r-test ruby -I. test/functional/add_path_test.rb
        timeout-minutes: 2

  # The lab topologies in Docker Compose: real containers, real addresses,
  # TCP 179 bound by the non-root user. See lab/README.md. Plus the fault
  # matrix against a native gobgpd, which needs no container.
  # The lab tests, a job per group. They used to run as one serial suite,
  # which made this job the sum of every file and the whole workflow's
  # clock: 12m42s on 95fe87b where no other job reached 50s. They are
  # independent, so the cost is the slowest group now and not the total.
  #
  # **The grouping is in test/lab_groups.rb and not here**, because a
  # list in this file would let a new lab test run in no job at all, and
  # a job that runs nothing exits 0 and reads as a pass.
  # test/unit/lab_groups_test.rb fails the unit suite until every file
  # under test/functional/lab is in exactly one group, so the two cannot
  # drift apart. Add a group there and it needs an entry below; the same
  # test is what catches a name changed in one place and not the other,
  # since run_lab.rb raises on a group it does not know.
  lab:
    name: lab ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker Compose topologies. The fault matrix here is the
          # GoBGP **4** measurement, where gobgp-matrix is GoBGP 3.
          - group: compose
            docker: true
          - group: gobgp-matrix
            gobgp: true
          - group: gobgp-families
            gobgp: true
          - group: gobgp-router
            gobgp: true
          - group: frr
            frr: true
          # No router binary and no Docker, and the one group that runs
          # a second step: fib_test needs CAP_NET_ADMIN.
          - group: local
            netns: true
    env:
      # The version the native fault matrix runs against. The Compose
      # topology pins a 4.x image, so pinning 3.x here measures both, and
      # they do not answer alike: GoBGP 3 resets on the attr_overrun case
      # where RFC 7606 section 4 makes treat-as-withdraw a MUST, and GoBGP
      # 4 fixed it. See GOBGP_3 in test/functional/lab/fault_matrix_scenario.rb.
      GOBGP_VERSION: 3.23.0
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # For the gobgp groups. Two binaries on PATH, no container: the
      # tests put both ends of the session on ports of their own, so
      # nothing here needs sudo or
      # net.ipv4.ip_unprivileged_port_start.
      #
      # The checksum is not ceremony. This is a third party binary going
      # straight into tar, and the release publishes the sums, so check
      # them. --ignore-missing is what lets the whole file be used when only
      # the amd64 tarball was fetched, and it still fails when that one does
      # not match, or when nothing in the file was verified at all.
      - name: Install gobgpd
        if: matrix.gobgp
        run: |
          base=https://github.com/osrg/gobgp/releases/download/v$GOBGP_VERSION
          tarball=gobgp_${GOBGP_VERSION}_linux_amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/gobgp"
          cd "$RUNNER_TEMP/gobgp"
          curl -fsSL -O "$base/$tarball"
          curl -fsSL -O "$base/gobgp_${GOBGP_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gobgp_${GOBGP_VERSION}_checksums.txt"
          tar -xzf "$tarball" gobgp gobgpd
          echo "$RUNNER_TEMP/gobgp" >> "$GITHUB_PATH"
          ./gobgpd --version
      # For the frr group. Ubuntu packages FRR, and 24.04's build is
      # 8.4.4, which is the version those tests assert against. No
      # container and no zebra: bgpd runs standalone on loopback, with
      # -S so it keeps the invoking user and needs no privilege. The
      # daemons are not started as a service, and must not be: the
      # tests run their own bgpd on ports of their own.
      - name: Install FRR
        if: matrix.frr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends frr
          /usr/lib/frr/bgpd --version | head -1
      - name: Lab tests
        shell: bash
        env:
          # Per group, so a group flunks only for the binary it needs.
          # Each means fail, do not skip, if that dependency is missing.
          LAB_REQUIRE_DOCKER: ${{ matrix.docker && '1' || '' }}
          LAB_REQUIRE_GOBGPD: ${{ matrix.gobgp && '1' || '' }}
          LAB_REQUIRE_FRR: ${{ matrix.frr && '1' || '' }}
        run: bundle exec ruby test/run_lab.rb ${{ matrix.group }} 2>&1 | tee test.log
      # The FIB test is the one lab test that needs a capability rather
      # than a binary: creating a network namespace needs CAP_NET_ADMIN, so
      # it omits itself in the step above, which runs unprivileged. Run it
      # again under sudo with LAB_REQUIRE_NETNS so it fails rather than
      # omits, because a conformance claim nothing checks reads as verified
      # (see "Lab and conformance" in CLAUDE.md for how that bit once).
      #
      # sudo drops the environment, so PATH has to be carried in or the
      # ruby from setup-ruby is not the one that runs.
      - name: FIB in a network namespace
        if: matrix.netns
        shell: bash
        run: |
          sudo -E env "PATH=$PATH" LAB_REQUIRE_NETNS=1 \
            bundle exec ruby -I. test/functional/lab/fib_test.rb
      - name: Show test failures as an annotation
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          # || true, because grep exits 1 when it matches nothing and
          # this step runs under bash -e: without it the step dies there
          # and the tail fallback below never runs, so a failure whose log
          # has no "Failure:" line is reported as nothing at all. That is
          # what happened to the first lab run of #159.
          msg=$(grep -E -A15 "^(Failure|Error):|Error\b.*\(LoadError\)|cannot load such file" test.log | head -80 || true)
          [ -n "$msg" ] || msg=$(tail -40 test.log)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=Test output::$msg"
