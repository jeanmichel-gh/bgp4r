! frr: FRR in AS 65002, the other end of bgp4rd's session, with BFD on
! it: bfdd runs (daemons), and `neighbor 10.0.12.1 bfd` asks it for a
! single hop session to bgp4rd at the default timers, 300 ms and a
! multiplier of 3, as bfdd4r's are.
frr version 10.2.1_git
frr defaults traditional
hostname frr
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
exit
!
interface eth1
 description to bgp
 ip address 10.0.12.2/30
exit
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 ! 3 and 9, the hold_time: 9 bgp's node file sets, so the hold timer
 ! alone would take nine seconds, and BFD is what makes it one.
 timers bgp 3 9
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 description bgp
 neighbor 10.0.12.1 timers connect 5
 neighbor 10.0.12.1 bfd
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
 exit-address-family
exit
!
