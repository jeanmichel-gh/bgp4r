! rr2: FRR in AS 65100, the reflector of a second cluster, 2.2.2.2.
! Its one client is dual. rr1 is a non-client peer.
!
! So a route from one of rr1's clients arrives here from a non-client
! with CLUSTER_LIST 1.1.1.1, and FRR reflects it to dual with its own
! cluster ID in front: 2.2.2.2 1.1.1.1. That is the second copy dual
! decides on, and it is FRR's encoding of both attributes that bgp4r
! reads, the other way round from rr1's clients.
!
! Its router ID is lower than rr1's on purpose. dual's README entry says
! why.
!
! The static route resolves every next hop in the lab, which reflection
! leaves alone and which no IGP carries here.
frr version 10.2.1_git
frr defaults traditional
hostname rr2
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip route 10.100.0.0/16 10.100.20.1
!
interface eth1
 description to rr1
 ip address 10.100.20.2/30
exit
!
interface eth2
 description to dual
 ip address 10.100.21.1/30
exit
!
router bgp 65100
 bgp router-id 10.100.255.1
 bgp cluster-id 2.2.2.2
 timers bgp 10 30
 !
 neighbor 10.100.20.1 remote-as 65100
 neighbor 10.100.20.1 description rr1, a non-client
 neighbor 10.100.20.1 timers connect 5
 neighbor 10.100.21.2 remote-as 65100
 neighbor 10.100.21.2 description dual, a client
 neighbor 10.100.21.2 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 10.100.21.2 route-reflector-client
 exit-address-family
exit
!
