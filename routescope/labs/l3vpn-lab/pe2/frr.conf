frr defaults traditional
hostname pe2
log stdout informational
ip forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
 ip router isis 1
 isis passive
exit
!
interface eth1
 description to p1
 ip address 10.0.23.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth2
 description to p2
 ip address 10.0.34.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 20
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 18000 25999
 segment-routing local-block 15000 15999
 segment-routing prefix 10.255.0.3/32 index 3
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
exit
!
router bgp 65000 vrf A
 bgp router-id 10.255.0.3
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:1
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:1
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf B
 bgp router-id 10.255.0.3
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:2
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:2
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
exit
!
