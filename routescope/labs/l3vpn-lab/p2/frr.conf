frr defaults traditional
hostname p2
log stdout informational
ip forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
 ip router isis 1
 isis passive
exit
!
interface eth1
 description to pe1
 ip address 10.0.14.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 20
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth2
 description to pe2
 ip address 10.0.34.1/30
 ip router isis 1
 isis network point-to-point
 isis metric 20
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis 1
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 19000 26999
 segment-routing local-block 15000 15999
 segment-routing prefix 10.255.0.4/32 index 4
exit
!
