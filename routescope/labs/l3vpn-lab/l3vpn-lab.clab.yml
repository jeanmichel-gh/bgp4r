# An L3VPN across an SR-MPLS core, bgp4rd as one PE and FRR as the other:
# docs/design/l3vpn-pe.md, "The lab" and "Gate".
#
#                        p1 (isis4r, SRGB 17000)
#   ce1a --+            /  metric 10        \             +-- ce2a
#          |  eth1     /                     \     eth1   |
#          pe1 -------                         ------- pe2
#          |  isis4r + bgp4rd                   FRR       |
#   ce1b --+  SRGB 16000  \  eth2         eth2 / SRGB     +-- ce2b
#                          \   metric 20     /   18000
#                        p2 (FRR, SRGB 19000)
#
# AS 65000, IS-IS level 2 with SR-MPLS. iBGP VPNv4 (AFI 1, SAFI 128)
# between the PEs' loopbacks. VRF A joins ce1a and ce2a, VRF B ce1b and
# ce2b, on the same addresses: 192.168.1.0/24 at pe1, 192.168.2.0/24 at
# pe2. RD 65000:1 and RT 65000:100 for A, 65000:2 and 65000:200 for B.
#
# pe1 is two containers in one network namespace: pe1 runs isisd and
# owns the interfaces and the VRF devices, pe1-bgp runs bgp4rd beside it.
#
# Images: isis4r:latest (isis), bgp4r-lab:latest (this repository) and
# quay.io/frrouting/frr:10.2.1. The host needs the vrf, mpls_router and
# mpls_iptunnel modules. ABOUT.md says what to look at.
name: l3vpn-lab

topology:
  nodes:
    # --- PE 1: the IGP half owns the namespace and makes the VRFs ----
    pe1:
      kind: linux
      image: isis4r:latest
      labels: { routescope.protocols: isis }
      binds: [pe1:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth4 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.12.1/30 dev eth1; ip addr add 10.0.14.1/30 dev eth2;
        ip addr add 10.255.0.1/32 dev lo; ip route del default dev eth0 2>/dev/null;
        ip link add A type vrf table 100; ip link set A up; ip link set eth3 master A;
        ip link add B type vrf table 200; ip link set B up; ip link set eth4 master B;
        ip addr add 192.168.1.1/24 dev eth3; ip addr add 192.168.1.1/24 dev eth4;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    # --- PE 1: the BGP half, in pe1's namespace ----------------------
    pe1-bgp:
      kind: linux
      image: bgp4r-lab:latest
      network-mode: container:pe1
      labels: { routescope.kind: bgp4r, routescope.protocols: bgp }
      binds: [pe1-bgp/bgp4rd.yml:/etc/bgp4r/bgp4rd.yml]
      cmd: exe/bgp4rd -f /etc/bgp4r/bgp4rd.yml -s /run/bgp4r/bgp4rd.sock -l -
    # --- The core ----------------------------------------------------
    p1:
      kind: linux
      image: isis4r:latest
      labels: { routescope.protocols: isis }
      binds: [p1:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.12.2/30 dev eth1; ip addr add 10.0.23.1/30 dev eth2;
        ip addr add 10.255.0.2/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    # frr.conf has the addresses too; FRR can miss them on links wired
    # after it starts. The default route Docker gives is removed.
    p2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      labels: { routescope.protocols: isis }
      binds: [p2:/etc/frr]
      exec:
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sysctl -qw net.mpls.platform_labels=100000 net.mpls.conf.eth1.input=1 net.mpls.conf.eth2.input=1
    # --- PE 2: FRR, IS-IS with SR and bgpd's VPN ---------------------
    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      labels: { routescope.protocols: "isis,bgp" }
      binds: [pe2:/etc/frr]
      exec:
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sysctl -qw net.mpls.platform_labels=100000 net.mpls.conf.eth1.input=1 net.mpls.conf.eth2.input=1
        - sh -c "ip link add A type vrf table 100; ip link set A up; ip link set eth3 master A; ip addr add 192.168.2.1/24 dev eth3"
        - sh -c "ip link add B type vrf table 200; ip link set B up; ip link set eth4 master B; ip addr add 192.168.2.1/24 dev eth4"
    # --- The customer sites: plain Linux, a default route to the PE --
    ce1a:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: linux }
      entrypoint: sleep
      cmd: infinity
      exec: ["ip addr add 192.168.1.2/24 dev eth1", "ip route replace default via 192.168.1.1"]
    ce1b:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: linux }
      entrypoint: sleep
      cmd: infinity
      exec: ["ip addr add 192.168.1.2/24 dev eth1", "ip route replace default via 192.168.1.1"]
    ce2a:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: linux }
      entrypoint: sleep
      cmd: infinity
      exec: ["ip addr add 192.168.2.2/24 dev eth1", "ip route replace default via 192.168.2.1"]
    ce2b:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: linux }
      entrypoint: sleep
      cmd: infinity
      exec: ["ip addr add 192.168.2.2/24 dev eth1", "ip route replace default via 192.168.2.1"]

  links:
    - endpoints: ["pe1:eth1", "p1:eth1"]
    - endpoints: ["pe1:eth2", "p2:eth1"]
    - endpoints: ["p1:eth2", "pe2:eth1"]
    - endpoints: ["p2:eth2", "pe2:eth2"]
    - endpoints: ["ce1a:eth1", "pe1:eth3"]
    - endpoints: ["ce1b:eth1", "pe1:eth4"]
    - endpoints: ["ce2a:eth1", "pe2:eth3"]
    - endpoints: ["ce2b:eth1", "pe2:eth4"]
