# A scenario for routescope's Scenarios panel (docs/scenarios.md):
# bgp4r docs/design/l3vpn-pe.md's gate, the parts a scenario can check.
# ABOUT.md has the rest: the labels on the wire, read with tcpdump on
# p1, and that ce1a's packets never reach ce2b, which has its address.
name: Gate
description: >-
  IS-IS with SR comes up and pe1 reaches pe2 on p1's label. Both PEs'
  iBGP VPN sessions to p1-bgp, the route reflector, come up, the CEs of VRF A come
  up by eBGP with AS override, and each customer site reaches the far
  one in its own VRF, on the same addresses. The p1 to
  pe2 link fails: pe1 reaches pe2 through p2, on p2's label, and the
  sites still reach each other. The link comes back, and so does the
  path.
capture: [p1, p2]
timeout: 420

steps:
  - expect: { isis_adjacencies: { node: p1, level: 2, up: 2 } }
    within: 60
  - expect: { isis_route: { node: pe1, prefix: 10.255.0.3/32, label: 17003 } }
    within: 60
  # Both PEs peer with p1-bgp, the VPN route reflector (bgp4r pull
  # request 6), and not with each other.
  - expect: { bgp_session: { node: p1-bgp, peer: 10.255.0.1, state: established } }
    within: 60
  - expect: { bgp_session: { node: p1-bgp, peer: 10.255.0.3, state: established } }
    within: 60
  # The CEs, by eBGP in VRF A (bgp4r pull request 7): each site reaches
  # the other's, and each PE replaced the sites' one ASN by its own.
  - expect: { bgp_session: { node: pe1-bgp, peer: 192.168.1.2, state: established } }
    within: 60
  - expect: { bgp_prefix: { node: ce1a, prefix: 172.16.2.0/24, next_hop: 192.168.1.1, as_path: '65000 65000' } }
    within: 60
  - expect: { bgp_prefix: { node: ce2a, prefix: 172.16.1.0/24, next_hop: 192.168.2.1, as_path: '65000 65000' } }
    within: 30
  # The VPN routes on their way (routescope's vrf_route and vpn_route,
  # docs/l3vpn.md there). The reflector holds each site's route under
  # VRF A's RD and Route Target; pe1-bgp takes pe2's with pe2 as its
  # originator; each PE installs the far site's route in VRF A, on the
  # far PE's loopback and p1's label for it. VPN labels change from one
  # start to the next, so they are left out.
  - expect: { vpn_route: { node: p1-bgp, rd: '65000:1', prefix: 172.16.1.0/24, next_hop: 10.255.0.1, route_target: '65000:100' } }
    within: 30
  - expect: { vpn_route: { node: p1-bgp, rd: '65000:1', prefix: 172.16.2.0/24, next_hop: 10.255.0.3, route_target: '65000:100' } }
  - expect: { vpn_route: { node: pe1-bgp, rd: '65000:1', prefix: 172.16.2.0/24, originator_id: 10.255.0.3, best: true } }
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.1.0/24, source: ce, next_hop: 192.168.1.2, state: installed } }
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.2.0/24, source: vpn, next_hop: 10.255.0.3, out_label: 17003, state: installed } }
    within: 30
  - expect: { vrf_route: { node: pe2, vrf: A, prefix: 172.16.1.0/24, source: vpn, next_hop: 10.255.0.1, out_label: 17001, state: installed } }
    within: 30
  - expect: { ping: { node: ce1a, from: 172.16.1.1, to: 172.16.2.1 } }
    within: 30
  - expect: { ping: { node: ce1a, to: 192.168.2.2 } }
    within: 30
  - expect: { ping: { node: ce1b, to: 192.168.2.2 } }
    within: 10
  - expect: { ping: { node: ce2a, to: 192.168.1.2 } }
  - expect: { ping: { node: ce2b, to: 192.168.1.2 } }

  - mark: p1 to pe2 link down
  - interface: p1:eth2
    state: down
  - expect: { isis_route: { node: pe1, prefix: 10.255.0.3/32, label: 19003 } }
    within: 30
  # bgp4rd re-reads the far PE's label at its next VRF sync.
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.2.0/24, out_label: 19003, state: installed } }
    within: 30
  - expect: { vrf_route: { node: pe2, vrf: A, prefix: 172.16.1.0/24, out_label: 19001, state: installed } }
    within: 30
  - expect: { ping: { node: ce1a, to: 192.168.2.2 } }
    within: 20
    measure: failover
  - expect: { ping: { node: ce1b, to: 192.168.2.2 } }
    within: 10

  - mark: p1 to pe2 link up
  - interface: p1:eth2
    state: up
  - expect: { isis_route: { node: pe1, prefix: 10.255.0.3/32, label: 17003 } }
    within: 30
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.2.0/24, out_label: 17003, state: installed } }
    within: 30
  - expect: { vrf_route: { node: pe2, vrf: A, prefix: 172.16.1.0/24, out_label: 17001, state: installed } }
    within: 30
  - expect: { ping: { node: ce1a, to: 192.168.2.2 } }
    within: 20
    measure: restore
  - expect: { ping: { node: ce1b, to: 192.168.2.2 } }
    within: 10

  # The same failover, but the link keeps its carrier and loses every
  # packet (netem), as a bad optic or a switch between them would.
  # Neither end sees the link go down. BFD on p1 to pe2, 300 ms x 3,
  # finds it, and both IS-IS routers drop the adjacency at once.
  - expect: { bfd_session: { node: p1, peer: 10.0.23.2, interface: eth2, state: up } }
    within: 30
  - expect: { bfd_session: { node: pe2, peer: 10.0.23.1, state: up } }
    within: 30
  - mark: p1 to pe2 link loses every packet
  - netem: p1:eth2
    loss: 100%
  - expect: { isis_route: { node: pe1, prefix: 10.255.0.3/32, label: 19003 } }
    within: 30
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.2.0/24, out_label: 19003, state: installed } }
    within: 30
  - expect: { vrf_route: { node: pe2, vrf: A, prefix: 172.16.1.0/24, out_label: 19001, state: installed } }
    within: 30
  - expect: { ping: { node: ce1a, to: 192.168.2.2 } }
    within: 20
    measure: failover_loss
  - expect: { ping: { node: ce1b, to: 192.168.2.2 } }
    within: 10
  - expect: { bfd_session: { node: p1, peer: 10.0.23.2, interface: eth2, state: down } }

  - mark: p1 to pe2 link clean again
  - netem: p1:eth2
    clear: true
  - expect: { bfd_session: { node: p1, peer: 10.0.23.2, interface: eth2, state: up } }
    within: 30
  - expect: { isis_route: { node: pe1, prefix: 10.255.0.3/32, label: 17003 } }
    within: 30
  - expect: { vrf_route: { node: pe1-bgp, vrf: A, prefix: 172.16.2.0/24, out_label: 17003, state: installed } }
    within: 30
  - expect: { vrf_route: { node: pe2, vrf: A, prefix: 172.16.1.0/24, out_label: 17001, state: installed } }
    within: 30
  - expect: { ping: { node: ce1a, to: 192.168.2.2 } }
    within: 20
    measure: restore_loss
  - expect: { ping: { node: ce1b, to: 192.168.2.2 } }
    within: 10

  # BFD on the PE to CE session of pe2 and ce2a: bfdd4r beside ce2a's
  # bgp4rd, FRR's bfdd in VRF A on pe2. ce2a is single-homed, so loss on
  # its link has no other path: the gate checks that the session goes
  # down and ce2a drops pe1's site in seconds, not the 30 s hold, and
  # does not time it.
  - expect: { bfd_session: { node: ce2a, peer: 192.168.2.1, interface: eth1, state: up } }
    within: 30
  - expect: { bfd_session: { node: pe2, peer: 192.168.2.2, state: up } }
    within: 30
  - mark: ce2a to pe2 link loses every packet
  - netem: ce2a:eth1
    loss: 100%
  - expect: { bfd_session: { node: ce2a, peer: 192.168.2.1, interface: eth1, state: down } }
    within: 5
  - expect: { bgp_prefix: { node: ce2a, prefix: 172.16.1.0/24, present: false } }
    within: 5
  - mark: ce2a to pe2 link clean again
  - netem: ce2a:eth1
    clear: true
  - expect: { bfd_session: { node: ce2a, peer: 192.168.2.1, interface: eth1, state: up } }
    within: 30
  - expect: { bgp_prefix: { node: ce2a, prefix: 172.16.1.0/24, next_hop: 192.168.2.1, as_path: '65000 65000' } }
    within: 60
  - expect: { ping: { node: ce1a, from: 172.16.1.1, to: 172.16.2.1 } }
    within: 30

  # The same on pe1 to ce1a, where pe1's end is in VRF A: bfdd4r beside
  # ce1a's bgp4rd, and pe1's bfdd4r, which pe1-bgp shares, in VRF A
  # (routescope docs/design/bfd-vrf.md).
  - expect: { bfd_session: { node: ce1a, peer: 192.168.1.1, interface: eth1, state: up } }
    within: 30
  - expect: { bfd_session: { node: pe1, peer: 192.168.1.2, interface: eth3, state: up } }
    within: 30
  - mark: ce1a to pe1 link loses every packet
  - netem: ce1a:eth1
    loss: 100%
  - expect: { bfd_session: { node: ce1a, peer: 192.168.1.1, interface: eth1, state: down } }
    within: 5
  - expect: { bgp_prefix: { node: ce1a, prefix: 172.16.2.0/24, present: false } }
    within: 5
  - mark: ce1a to pe1 link clean again
  - netem: ce1a:eth1
    clear: true
  - expect: { bfd_session: { node: ce1a, peer: 192.168.1.1, interface: eth1, state: up } }
    within: 30
  - expect: { bgp_prefix: { node: ce1a, prefix: 172.16.2.0/24, next_hop: 192.168.1.1, as_path: '65000 65000' } }
    within: 60
  - expect: { ping: { node: ce2a, from: 172.16.2.1, to: 172.16.1.1 } }
    within: 30
