# The b to d link goes down. No NOTIFICATION can cross it, so b's
# session to d ends when its hold timer runs out, 9 seconds, and then
# the path through c is the only one. The link comes back and the
# direct path wins again.
#
# The kernel removes b's route through eth3 the moment the link is down,
# so packets to d are dropped until the session ends. `failover` is that
# gap, measured where it matters: the first traceroute through c.
#
# RUN IN NAMESPACES ONLY: routescope ran this on 2026-11-06, from its
# claude/ping-traceroute branch, against this lab's own files in four
# network namespaces with docker stood in by a script. It passed. It has
# not been run in a deployed lab. Its twin in this repository is
# test/functional/lab/fwd_lab_netns_test.rb.
#
# ping and traceroute are routescope's forwarding conditions, which ask
# the node's own kernel. traceroute names each hop by the address it
# answers from, the near end of the link a packet arrived on.
name: The b to d link fails and packets move through c
description: >-
  b:eth3 goes down. Once b's hold timer ends the session, packets from a
  to d cross c, both ways. Then the link comes back and they take the
  direct link again.
capture: [b, c]
timeout: 180

steps:
  - expect: { traceroute: { node: a, from: 10.255.0.1, to: 10.255.0.4, hops: [10.200.1.2, 10.255.0.4] } }
    within: 60
  - expect: { ping: { node: a, from: 10.255.0.1, to: 10.255.0.4, count: 20 } }

  - mark: b to d link down
  - interface: b:eth3
    state: down
  - expect: { traceroute: { node: a, from: 10.255.0.1, to: 10.255.0.4, hops: [10.200.1.2, 10.200.2.2, 10.255.0.4] } }
    within: 20
    measure: failover
  - expect: { ping: { node: a, from: 10.255.0.1, to: 10.255.0.4, count: 20 } }
    within: 10
  - expect: { traceroute: { node: d, from: 10.255.0.4, to: 10.255.0.1, hops: [10.200.3.1, 10.200.2.1, 10.255.0.1] } }
    within: 10
  - expect: { bgp_prefix: { node: b, prefix: 10.255.0.4/32, next_hop: 10.200.2.2, as_path: '65003 65004' } }
  - expect: { bgp_prefix: { node: a, prefix: 10.255.0.4/32, as_path: '65002 65003 65004' } }

  - mark: b to d link up
  - interface: b:eth3
    state: up
  - expect: { traceroute: { node: a, from: 10.255.0.1, to: 10.255.0.4, hops: [10.200.1.2, 10.255.0.4] } }
    within: 30
    measure: restore
  - expect: { ping: { node: a, from: 10.255.0.1, to: 10.255.0.4, count: 20 } }
    within: 10
  - expect: { traceroute: { node: d, from: 10.255.0.4, to: 10.255.0.1, hops: [10.200.4.1, 10.255.0.1] } }
    within: 10
